<style>
    :root {
        --bg-start: #FAF7F2;
        --bg-end: #F4EFE8;

        --card-bg: rgba(255, 255, 255, 0.55);
        --glass-border: rgba(235, 225, 215, 0.35);

        --accent: #E8B48C;           /* 主色：淡橙 */
        --accent-light: #F4DCC7;     /* 浅橙 */
        --text-main: #3A3A3A;        /* 柔黑 */
        --text-soft: #7A7068;        /* 灰棕 */
        --shadow-soft: rgba(0,0,0,0.06);

        --table-header: linear-gradient(to right, #E8B48C, #D4A982);
    }

    body {
        background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial;
        color: var(--text-main);
        line-height: 1.6;
        margin: 0;
        padding: 0;
    }

    /* 主容器毛玻璃替换 */
    .section,
    .card,
    .tool-item,
    .timeline-content,
    table {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
        box-shadow: 0 8px 26px var(--shadow-soft);
    }

    .container {
        padding: 2rem 1.5rem;
    }

    h1 {
        color: var(--text-main);
        font-weight: 600;
        text-shadow: 0 2px 4px rgba(0,0,0,0.04);
    }

    h2, h3 {
        color: var(--text-main);
        font-weight: 600;
    }

    p, li {
        color: var(--text-soft);
    }

    /* 列表小圆点换成柔橙 */
    li::before {
        color: var(--accent);
    }

    /* 卡片悬浮更轻盈 */
    .section:hover,
    .card:hover,
    .tool-item:hover,
    .timeline-content:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    }

    /* 强调左边竖线颜色 */
    h3 {
        border-left: 3px solid var(--accent);
    }

    /* 表格头部变淡橙渐变 */
    th {
        background: var(--table-header);
        color: #fff;
        font-weight: 500;
    }

    tr:nth-child(even) {
        background: rgba(232, 180, 140, 0.12);
    }

    /* 时间轴线变淡橙 */
    .timeline::after {
        background: linear-gradient(to bottom, transparent, var(--accent), transparent);
    }

    /* 时间轴节点 */
    .timeline-item::after {
        background: #fff;
        border-color: var(--accent);
        box-shadow: 0 0 10px rgba(232, 180, 140, 0.5);
    }

    /* 图标颜色统一成淡橙 */
    h2 i, .card h4 i, .tool-item i {
        color: var(--accent);
    }

    footer {
        background: rgba(255,255,255,0.4);
        backdrop-filter: blur(6px);
        color: var(--text-soft);
        border-top: 1px solid var(--glass-border);
    }
</style>
